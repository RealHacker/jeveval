[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jeveval"
version = "0.1.0"
description = "Benchmark harness for TypeSafe Jev and OpenAI-compatible reference models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
jeveval = "jeveval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["jeveval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

